[project]
name = "ai-document-assistant"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Praveena", email = "praveenasuku3@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "chromadb>=1.5.9",
    "email-validator>=2.4.0",
    "fastapi>=0.163.1",
    "google-genai>=3.3.0",
    "httpx>=0.28.1",
    "langchain>=1.5.0",
    "langchain-google-genai>=4.5.0",
    "langgraph>=1.2.22",
    "pwdlib[argon2]>=0.4.2",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.3",
    "pyjwt>=2.15.1",
    "pymysql>=1.2.4",
    "pypdf>=7.1.0",
    "python-multipart>=0.0.34",
    "redis>=8.1.0",
    "sentence-transformers>=6.3.0",
    "slowapi>=0.1.10",
    "sqlalchemy>=2.1.8",
    "uvicorn>=0.54.0",
]

[project.scripts]
ai-document-assistant = "ai_document_assistant:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
